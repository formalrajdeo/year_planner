openapi: 3.0.3
info:
  title: Year Planner API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
      responses:
        '201':
          description: User created
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly session cookie and readable CSRF cookie
        '403':
          description: Request origin is not allowed
      security: []
  /api/v1/auth/login:
    post:
      summary: Log in as a user
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful login
        '403':
          description: Request origin is not allowed
        '429':
          description: Login rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until another attempt may be made
        '503':
          description: Authentication temporarily unavailable
      security: []
  /api/v1/auth/password/forgot:
    post:
      summary: Request password reset instructions
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted; response does not disclose whether the account exists
        '403':
          description: Request origin is not allowed
        '429':
          description: Recovery rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Password recovery is unavailable or not configured
      security: []
  /api/v1/auth/password/reset:
    post:
      summary: Set a new password with a one-time reset token
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: One-time token sent in the URL fragment; expires after one hour
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed and all existing sessions revoked
        '400':
          description: Invalid or expired token, or invalid password
        '403':
          description: Request origin is not allowed
        '503':
          description: Password recovery is not configured
      security: []
  /api/v1/auth/me:
    get:
      summary: Fetch the current authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user profile
    patch:
      summary: Update the current user's display name
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: Updated user profile
        '401':
          description: Missing, invalid, or expired session
        '403':
          description: Invalid CSRF token or request origin
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session token
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logged out
        '403':
          description: Invalid CSRF token or request origin
  /api/v1/workspaces:
    post:
      summary: Create a workspace owned by the authenticated user
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/origin'
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid workspace request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid session
        '403':
          description: Invalid CSRF token or request origin
        '409':
          description: Workspace slug already exists
        '500':
          description: Workspace could not be created
        '503':
          description: Workspace service unavailable
    get:
      summary: List workspaces owned by the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Workspaces owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          description: Missing or invalid session
        '500':
          description: Workspaces could not be listed
        '503':
          description: Workspace service unavailable
  /api/v1/workspaces/{workspaceID}:
    get:
      summary: Get a workspace owned by the authenticated user
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Missing or invalid session
        '404':
          description: Workspace not found
        '500':
          description: Workspace could not be loaded
        '503':
          description: Workspace service unavailable
    patch:
      summary: Rename a workspace owned by the authenticated user
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/origin'
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid workspace update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid session
        '403':
          description: Invalid CSRF token or request origin
        '404':
          description: Workspace not found
        '500':
          description: Workspace could not be updated
        '503':
          description: Workspace service unavailable
components:
  parameters:
    origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
    csrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  schemas:
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Workspace:
      type: object
      required: [id, name, slug, ownerUserId, settings, schemaVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        ownerUserId:
          type: string
          readOnly: true
        settings:
          type: object
          additionalProperties: false
        schemaVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yearplanner_session
