openapi: 3.0.3
info:
  title: Year Planner Auth API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
      responses:
        '201':
          description: User created
  /api/v1/auth/login:
    post:
      summary: Log in as a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful login
  /api/v1/auth/me:
    get:
      summary: Fetch the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
    patch:
      summary: Update the current user's display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: Updated user profile
        '401':
          description: Missing, invalid, or expired session
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
